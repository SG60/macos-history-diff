[package]
name = "macos-history-diff"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileVersion", "NSURL", "NSDate", "NSArray", "NSString", "NSError", "NSObject", "NSEnumerator"] }
rfd = "0.17.2"
similar = "3.2.1"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[[bin]]
name = "mhd"
path = "src/main.rs"
